name: NiaKylie Backend CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  IMAGE_NAME: niakylie-backend
  DOCKERHUB_USERNAME: harishsahu

jobs:
  # ─── 1. BUILD & TEST ───────────────────────────────────────────────────────
  build-and-test:
    name: Build & Run Unit Tests
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/niakylie_test
      JWT_SECRET: ci-test-jwt-secret
      JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret
      REDIS_ENABLED: "false"
      ADMIN_SECRET_KEY: ci-test-admin-secret

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Checking
        run: npx tsc --noEmit

      - name: Execute Unit Tests
        run: npm test -- --passWithNoTests

      - name: Build Production Bundle
        run: npm run build

  # ─── 2. DOCKER BUILD & PUBLISH ─────────────────────────────────────────────
  docker-publish:
    name: Build & Push Docker Image
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Image metadata
        id: meta
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: harishsahu
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            harishsahu/${{ env.IMAGE_NAME }}:latest
            harishsahu/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── 3. DEPLOY TO EC2 ──────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production EC2
    needs: docker-publish
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Copy compose + nginx to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,nginx.conf,public"
          target: /opt/niakylie_backend
          overwrite: true

      - name: Write .env from GitHub Secrets & restart stack
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKERHUB_USERNAME: harishsahu
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION: ${{ secrets.JWT_EXPIRATION }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          JWT_REFRESH_EXPIRATION: ${{ secrets.JWT_REFRESH_EXPIRATION }}
          ADMIN_SECRET_KEY: ${{ secrets.ADMIN_SECRET_KEY }}
          THROTTLE_TTL: ${{ secrets.THROTTLE_TTL }}
          THROTTLE_LIMIT: ${{ secrets.THROTTLE_LIMIT }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_REGION: ${{ secrets.AWS_S3_REGION }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,IMAGE_TAG,MONGODB_URI,JWT_SECRET,JWT_EXPIRATION,JWT_REFRESH_SECRET,JWT_REFRESH_EXPIRATION,ADMIN_SECRET_KEY,THROTTLE_TTL,THROTTLE_LIMIT,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASS,SMTP_FROM,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_S3_REGION,AWS_S3_BUCKET,RAZORPAY_KEY_ID,RAZORPAY_KEY_SECRET
          script: |
            set -e
            cd /opt/niakylie_backend
            mkdir -p public

            if [ -z "${AWS_ACCESS_KEY_ID}" ] || [ -z "${AWS_SECRET_ACCESS_KEY}" ] || [ -z "${AWS_S3_REGION}" ] || [ -z "${AWS_S3_BUCKET}" ]; then
              echo "Deployment blocked: AWS S3 secrets are not configured in GitHub Actions."
              exit 1
            fi

            # Build .env on the server from GitHub Secrets (never committed to git)
            umask 077
            {
              echo "NODE_ENV=production"
              echo "PORT=3000"
              echo "API_PREFIX=api"
              echo "API_VERSION=v1"
              echo "REDIS_ENABLED=false"
              echo "IMAGE_TAG=${IMAGE_TAG}"
              echo "MONGODB_URI=${MONGODB_URI}"
              echo "JWT_SECRET=${JWT_SECRET}"
              echo "JWT_EXPIRATION=${JWT_EXPIRATION:-7d}"
              echo "JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}"
              echo "JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION:-7d}"
              echo "ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY}"
              echo "THROTTLE_TTL=${THROTTLE_TTL:-60000}"
              echo "THROTTLE_LIMIT=${THROTTLE_LIMIT:-100}"
              echo "SMTP_HOST=${SMTP_HOST}"
              echo "SMTP_PORT=${SMTP_PORT:-587}"
              echo "SMTP_USER=${SMTP_USER}"
              echo "SMTP_PASS=\"${SMTP_PASS}\""
              echo "SMTP_FROM=\"${SMTP_FROM}\""
              echo "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}"
              echo "AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}"
              echo "AWS_S3_REGION=${AWS_S3_REGION}"
              echo "AWS_S3_BUCKET=${AWS_S3_BUCKET}"
              echo "RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}"
              echo "RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}"
            } > .env

            echo "${DOCKERHUB_TOKEN}" | docker login -u harishsahu --password-stdin
            docker compose pull app
            docker compose up -d --remove-orphans
            docker image prune -af

            # Health check inside the app container (port 3000 is not published on host)
            for i in 1 2 3 4 5 6; do
              if docker compose exec -T app curl -fsS http://127.0.0.1:3000/api/v1/health; then
                echo "Deploy succeeded for image tag ${IMAGE_TAG}"
                exit 0
              fi
              sleep 5
            done
            echo "Health check failed"
            docker compose logs --tail=80 app
            exit 1
