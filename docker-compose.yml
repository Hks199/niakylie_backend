# Production stack for EC2 (CI/CD pulls image from Docker Hub)
# Local: DOCKERHUB_USERNAME=youruser docker compose up -d --build
# EC2:   GitHub Actions writes .env + pulls pre-built image

services:
  app:
    image: ${DOCKERHUB_USERNAME}/niakylie-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: niakylie_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_ENABLED: "false"
    expose:
      - "3000"
    volumes:
      - uploads_data:/usr/src/app/public/uploads
    networks:
      - niakylie_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: niakylie_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./public:/usr/share/nginx/html/public:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - niakylie_network

networks:
  niakylie_network:
    driver: bridge

volumes:
  uploads_data:
  certbot_www:
  certbot_certs:
