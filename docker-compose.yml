version: '3.8'

services:
  # ─── 1. BACKEND API ────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: niakylie_api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - API_PREFIX=api
      - API_VERSION=v1
      - MONGODB_URI=mongodb://root:niakylie_secret_pass@mongo:27017/niakylie_db?authSource=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis_secret_pass
      - REDIS_TTL=600
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/usr/src/app/public/uploads
    networks:
      - niakylie_network

  # ─── 2. MONGODB DATABASE ──────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: niakylie_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: niakylie_secret_pass
      MONGO_INITDB_DATABASE: niakylie_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - niakylie_network

  # ─── 3. REDIS IN-MEMORY CACHE ──────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: niakylie_redis
    restart: unless-stopped
    command: redis-server --requirepass redis_secret_pass --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_secret_pass", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - niakylie_network

  # ─── 4. NGINX REVERSE PROXY ────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: niakylie_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./public:/usr/share/nginx/html/public:ro
      - certbot_certs:/etc/letsencrypt
    depends_on:
      - app
    networks:
      - niakylie_network

networks:
  niakylie_network:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
  uploads_data:
  certbot_certs:
